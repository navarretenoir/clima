# Clima — configuración de empaquetado Linux (la usa "$(git rev-parse --show-toplevel)/herramientas"/linux-pkg/empaquetar.sh)
APP_ID=org.kotone.Clima
PAQUETE=clima
NOMBRE="Clima"
NOMBRE_ARCHIVO=Clima
VERSION=$(cat "$APP/VERSION")
BIN_GUI=clima-app
RESUMEN="El tiempo para las comunas de Chile, con cielo animado"
DESCRIPCION="Tiempo actual, 24 horas y 10 días para las 346 comunas de Chile, con cielo animado por condición de día y de noche, alerta ambiental por MP2,5, restricción vehicular, aviso de riesgo de suspensión de clases, fase lunar y mareas. Datos de Open-Meteo. Incluye el comando de consola clima."
DEPS_RPM="gtk4, libadwaita, webkitgtk6.0, json-glib, libcurl, geoclue2-libs"
DEPS_DEB="libgtk-4-1, libadwaita-1-0, libwebkitgtk-6.0-4, libjson-glib-1.0-0, libcurl4t64 | libcurl4, libgeoclue-2-0"
FLATPAK_EXTRA="--system-talk-name=org.freedesktop.GeoClue2"
SNAP_EXTRA=", location-observe"

# compilar <prefijo> <salida>: binarios con rutas de instalación bajo <prefijo>
compilar() {
  local pre=$1 out=$2 w; w=$(mktemp -d)
  cp -a "$APP/c/." "$w/"; rm -f "$w"/clima "$w"/*-scraper "$w"/*.bak-*
  make -s -C "$w" ROOT="$pre/share/clima" VERSION="$(cat "$APP/VERSION")" \
       EXTRA_CFLAGS="-DCLIMA_LIBEXEC='\"$pre/libexec/clima\"'" >/dev/null
  strip "$w/clima" "$w/suspension-scraper" "$w/restriccion-scraper"
  cp "$w/clima" "$w/suspension-scraper" "$w/restriccion-scraper" "$out/"
  rm -rf "$w"
}
# instalar <stage> <prefijo> <binarios>
instalar() {
  local st=$1 pre=$2 b=$3
  install -Dm755 "$b/clima" "$st$pre/bin/clima"
  install -Dm755 "$b/suspension-scraper" "$st$pre/libexec/clima/suspension-scraper"
  install -Dm755 "$b/restriccion-scraper" "$st$pre/libexec/clima/restriccion-scraper"
  mkdir -p "$st$pre/share/clima"; cp -r "$APP/ui" "$APP/data" "$st$pre/share/clima/"
  cat > "$st$pre/bin/clima-app" <<'W'
#!/bin/sh
# Clima (ventana). Sin aceleración 3D por defecto: WebKitGTK la usa poco aquí y así no despierta la GPU dedicada.
: "${CLIMA_HWACCEL:=never}"; export CLIMA_HWACCEL
exec "$(dirname "$(readlink -f "$0")")/clima" --gui "$@"
W
  chmod 755 "$st$pre/bin/clima-app"
}
# variables extra para AppImage/Snap ($HERE = raíz del AppDir)
appimage_entorno() {
  echo 'export CLIMA_DIR="$HERE/usr/share/clima" CLIMA_LIBEXEC="$HERE/usr/libexec/clima"'
}
