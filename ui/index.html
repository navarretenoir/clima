<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Clima</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Degradados compartidos por todos los íconos del clima (estilo SF Symbols multicolor). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="gSun" cx="40%" cy="38%" r="70%">
        <stop offset="0" stop-color="#FFF3A0"/><stop offset=".55" stop-color="#FFCC1E"/><stop offset="1" stop-color="#FFA40A"/>
      </radialGradient>
      <linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D3DCE8"/>
      </linearGradient>
      <linearGradient id="gCloudG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#E4E9F0"/><stop offset="1" stop-color="#AEB9C9"/>
      </linearGradient>
      <linearGradient id="gCloudD" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#C2CAD6"/><stop offset="1" stop-color="#7F8B9D"/>
      </linearGradient>
      <linearGradient id="gMoon" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFFBEA"/><stop offset="1" stop-color="#D9D3BE"/>
      </linearGradient>
      <linearGradient id="gBolt" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFE65C"/><stop offset="1" stop-color="#FFAE00"/>
      </linearGradient>
    </defs>
  </svg>
  <canvas id="fx"></canvas>
  <div id="pull"><div class="pspin"></div></div>
  <div id="app">
    <div class="searchbar">
      <div class="sfield">
        <svg class="sicon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.8" cy="6.8" r="4.8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 10.4l3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="text" placeholder="Buscar ciudad de Chile" autocomplete="off" spellcheck="false">
        <div id="suggest"></div>
      </div>
      <button id="loc" title="Mi ubicación" aria-label="Mi ubicación">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14.2 1.8L1.9 7.1c-.5.2-.4.9.1 1l5 1 1 5c.1.5.8.6 1 .1l5.3-12.3c.2-.4-.2-.8-.6-.6z" fill="currentColor"/></svg>
      </button>
    </div>
    <div id="content"><div class="loading">Cargando el clima…</div></div>
  </div>
  <div id="overlay"></div>
  <script src="fx.js"></script>
  <script src="app.js"></script>
</body>
</html>
